# ARTEX Tencent TSec Benchmark evaluation image ---- local one-click build + run.
# Does not interfere with the production docker-compose.yml (multi-service: artex+postgres).
# Usage:
#   cp bench/.env.example bench/.env   # Fill in LLM_API_KEY / BENCHMARK_TOKEN, etc.
#   docker compose -f docker-compose.bench.yml up --build      # Build and run in foreground (watch logs)
#   docker compose -f docker-compose.bench.yml up --build -d   # Run in background
#   docker compose -f docker-compose.bench.yml logs -f
#   docker compose -f docker-compose.bench.yml down            # Stop (add -v to also delete data volumes)
# Browser: http://localhost:8787 (log in with ADMIN_PASSWORD)

services:
  artex-bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    image: artex-bench:latest
    container_name: artex-bench
    env_file:
      - bench/.env
    # Share network with the physical host: containers use the host network stack directly and can reach target networks on the host/VPN directly.
    # In host mode no ports mapping is used; containers bind host ports directly: 8787 (UI/API), 8788 (proxy),
    # Plus internal PostgreSQL 5432 ---- make sure these three host ports are free (stop services occupying them before local testing).
    network_mode: host
    restart: "no"

volumes:
  artex_bench_data:
